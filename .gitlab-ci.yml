# Root CI pipeline for the unified-serial-term monorepo.
#
# GitLab reads ONLY this root .gitlab-ci.yml. (The legacy
# terminal-app/.gitlab-ci.yml is superseded by this file and is ignored by
# GitLab — it is kept for reference and can be removed once this is live.)
#
# Design:
#   - One job per component, scoped with `rules: changes` so an edit to one
#     component doesn't rebuild the others. `terminal-app` also rebuilds on a
#     `ftdi-driver` change, since it consumes the driver (file:../ftdi-driver).
#   - The runner is a SHELL executor on Agentlab1 (a VM, no USB ports) — there
#     is no `image:`; jobs run directly on the host, so the host provides the
#     toolchain (Node 22 + npm, python3, and the Playwright browser deps).
#     See terminal-app/docs/CI-RUNNER-SETUP.md for one-time host provisioning
#     and runner registration. The check jobs are untagged, so register the
#     runner with "Run untagged jobs" enabled.
#   - No `cache:` — GitLab Runner caching needs an object-storage backend
#     (s3/gcs/azure); a bare shell runner has none, so `cache:` only logs
#     "Could not create cache adapter" and archives nothing. `npm ci` runs
#     fresh each job (a few seconds); add a cache backend later if it matters.
#   - Hardware-in-loop jobs are gated to a runner tagged `hil-hardware` (the
#     machine with the Pico + FTDI rigs attached) and are manual-only.

# Stage order makes `hw` a GATE for `deploy`: on a release-hw-* tag the HIL
# jobs run automatically and a deploy only starts when they pass. On every
# other pipeline the hw jobs stay manual + allow_failure, so they never block.
stages:
  - check
  - hw
  - deploy

# ──────────────────────────────────────────────────────────────────────────
# ftdi-driver — TypeScript WebUSB driver library (npm package ftdi-webusb-driver)
# ──────────────────────────────────────────────────────────────────────────
ftdi-driver:
  stage: check
  rules:
    - changes: [ftdi-driver/**/*]
  script:
    - cd ftdi-driver
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run build
  artifacts:
    paths: [ftdi-driver/dist/]
    expire_in: 1 week

# ──────────────────────────────────────────────────────────────────────────
# terminal-app — Vue 3 + Vite browser terminal (depends on ftdi-driver)
# ──────────────────────────────────────────────────────────────────────────
terminal-app:
  stage: check
  rules:
    - changes: [terminal-app/**/*, ftdi-driver/**/*]
  script:
    - cd terminal-app
    - npm ci --no-audit --no-fund
    - npm run lint
    - npm run typecheck
    # Build the sibling ../ftdi-driver first so the WebUSB-backend unit tests
    # can import the package; `npm run build` would also trigger this via its
    # prebuild hook, but tests run before build.
    - node script/ensure-driver-built.mjs
    - npm test
    - npm run build
  artifacts:
    paths: [terminal-app/dist/]
    expire_in: 1 week

# ──────────────────────────────────────────────────────────────────────────
# terminal-app:e2e — Playwright browser tests (mocked backends, no hardware)
# Pure-mock suite — no USB — so it runs on Agentlab1. `playwright install`
# fetches the browser build matching the project's @playwright/test version
# (idempotent; cached in the runner user's ~/.cache/ms-playwright after the
# first run). The browser's OS-level libraries are installed once during host
# setup (`sudo npx playwright install-deps chromium` — see CI-RUNNER-SETUP.md);
# we deliberately omit `--with-deps` here so the job needs no sudo.
# @hardware-tagged tests are excluded unless TERMINAL_HW_TEST is set (define it
# as a CI/CD variable on a USB-equipped runner to include them); the real
# device suite lives in the manual `hw` stage below.
# ──────────────────────────────────────────────────────────────────────────
terminal-app:e2e:
  stage: check
  rules:
    - changes: [terminal-app/**/*, ftdi-driver/**/*]
  script:
    - cd terminal-app
    - npm ci --no-audit --no-fund
    - node script/ensure-driver-built.mjs
    - npx playwright install chromium
    # Free port 5173 in case a previous job left a stale Vite process on the runner host.
    - fuser -k 5173/tcp 2>/dev/null || true
    - npm run test:e2e
  artifacts:
    when: on_failure
    paths:
      - terminal-app/test-results/
      - terminal-app/playwright-report/
    expire_in: 1 week

# ──────────────────────────────────────────────────────────────────────────
# Python components — hil-preflight, ftdi-loopback-verify, pico-cdc-test-rig
# The real device tests are hardware-gated (they pytest.fail when a device is
# absent), so CI only does a syntax/compile smoke here; the live runs are in
# the `hw` stage below on the rig-attached runner.
# ──────────────────────────────────────────────────────────────────────────
python-suites:
  stage: check
  rules:
    - changes:
        - hil-preflight/**/*
        - ftdi-loopback-verify/**/*
        - pico-cdc-test-rig/**/*
  script:
    - find hil-preflight ftdi-loopback-verify pico-cdc-test-rig -name '*.py' -print0 | xargs -0 -r python3 -m py_compile
    - bash -n hil-preflight/preflight.sh

# ──────────────────────────────────────────────────────────────────────────
# terminal-app:deploy:staging — publish to the staging URL after all checks pass.
#
# Runs automatically on every push to main that touches terminal-app or
# ftdi-driver. Uses CI_MODE=1 so fetch-build-deploy.sh skips the mirror guard
# and git-reset (the runner already has the right checkout); it still runs npm ci
# + npm run build and then sudo rsync the bundle to /var/www/serial-terminal.
#
# Prerequisites (one-time host setup on Agentlab1):
#   - /etc/sudoers.d/gitlab-runner-deploy grants gitlab-runner NOPASSWD for
#     /usr/bin/rsync and /usr/bin/chown (already in place).
#   - DEPLOY_SITE_HOST CI/CD variable is set at project level in GitLab so the
#     post-deploy HTTPS verify step knows the public hostname. The webroot
#     defaults to /var/www/serial-terminal (matches the nginx config).
# ──────────────────────────────────────────────────────────────────────────
terminal-app:deploy:staging:
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - terminal-app/**/*
        - ftdi-driver/**/*
  variables:
    CI_MODE: "1"
    DEPLOY_WEBROOT: /var/www/serial-terminal
  script:
    - cd terminal-app
    - bash script/fetch-build-deploy.sh serial-lab
  environment:
    name: staging
    url: https://serial-lab.test.delivery-academy.se/

# ──────────────────────────────────────────────────────────────────────────
# terminal-app:deploy:production — publish a verified release tag to the
# production server URL.
#
# Triggered ONLY by pushing a `release-*` tag (created by
# terminal-app/script/release-production.sh — the big red button). A tag
# pipeline re-runs the full check stage first (the `rules: changes` jobs all
# evaluate true on tags), so the deploy never runs on a build that fails
# lint/tests/e2e. Protect the `release-*` pattern in GitLab (Settings →
# Repository → Protected tags) so only maintainers can trigger this.
#
# Movability: nothing here is host-specific. To serve from another machine,
# install nginx + the webroot there (LAB-SERVER-SETUP.md), register a GitLab
# runner on it, add the gitlab-runner sudoers entry for rsync/chown, and (if
# more than one runner serves this project) pin the deploy jobs to it with a
# runner tag.
# ──────────────────────────────────────────────────────────────────────────
terminal-app:deploy:production:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG =~ /^release-/
  variables:
    CI_MODE: "1"
    DEPLOY_PROD_WEBROOT: /var/www/serial-terminal-production
    DEPLOY_PROD_SITE_HOST: unified-serial.delivery-academy.se
  script:
    - cd terminal-app
    - bash script/fetch-build-deploy.sh production "$CI_COMMIT_TAG"
  environment:
    name: production
    url: https://unified-serial.delivery-academy.se/

# ──────────────────────────────────────────────────────────────────────────
# Hardware-in-loop — runs ONLY on a runner tagged `hil-hardware` (a self-managed
# runner on the machine with the Pico + FTDI rigs physically attached), and only
# when triggered by hand. The runner needs node, python3, and udev access to the
# USB devices. `npm run test:hw` runs ../hil-preflight/preflight.sh first.
# ──────────────────────────────────────────────────────────────────────────
# Two release-tag families (created by terminal-app/script/release-production.sh):
#   release-YYYY-MM-DD      software gate only - checks pass, deploy runs.
#                           For changes verifiable in CI alone (UI logic etc.).
#   release-hw-YYYY-MM-DD   hardware gate - the HIL jobs below run
#                           AUTOMATICALLY and must pass before the deploy
#                           stage starts. For changes touching the serial/USB
#                           data path.
# When more HIL platforms get runners (windows / macos), add jobs here with
# those runner tags under the same release-hw rule - the deploy stage waits
# for all of them; no extra "tested OK" bookkeeping is needed.
.hw:
  stage: hw
  tags: [hil-hardware]
  rules:
    # release-hw-* tag: run automatically and BLOCK the deploy stage on failure.
    - if: $CI_COMMIT_TAG =~ /^release-hw-/
    # everywhere else: manual trigger, never blocks later stages.
    - when: manual
      allow_failure: true
  # shell executor / native environment (same as the check jobs)

terminal-app:test:hw:
  extends: .hw
  script:
    - cd terminal-app
    - npm ci --no-audit --no-fund
    # Same pattern as terminal-app:e2e — fetch the browser build matching the
    # project's @playwright/test (idempotent, cached in ~/.cache/ms-playwright).
    # The chromium OS libraries are a one-time host step on the hw runner:
    # see hil-preflight/rpi5-gitlab-runner-setup.md §"Provision for hw jobs".
    - npx playwright install chromium
    - fuser -k 5173/tcp 2>/dev/null || true
    - npm run test:hw

ftdi-driver:test:hw:
  extends: .hw
  script:
    - cd ftdi-driver
    - npm ci --no-audit --no-fund
    - npm run test:hw
